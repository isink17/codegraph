name: npm package

on:
  push:
    branches: [v2.0]
    paths:
      - 'npm/**'
      - '.github/scripts/build-release-asset.sh'
      - '.github/scripts/verify-release-assets.sh'
      - '.github/scripts/verify-release-assets_test.sh'
      - '.github/workflows/npm-package.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [v2.0]
    paths:
      - 'npm/**'
      - '.github/workflows/npm-package.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  release-shaped:
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[release-dry-run]') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            archive_ext: tar.gz
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            archive_ext: tar.gz
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            archive_ext: tar.gz
          - runner: macos-15
            goos: darwin
            goarch: arm64
            archive_ext: tar.gz
          - runner: windows-2025
            goos: windows
            goarch: amd64
            archive_ext: zip
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            archive_ext: zip
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release-shaped assets
        shell: bash
        run: bash .github/scripts/build-release-asset.sh v2.0.0 ${{ matrix.goos }} ${{ matrix.goarch }} ${{ matrix.archive_ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/codegraph-v*
          retention-days: 1

  release-shape-check:
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[release-dry-run]') }}
    needs: release-shaped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Stage npm version and verify complete artifact set
        working-directory: npm
        run: |
          npm version 2.0.0 --no-git-tag-version --ignore-scripts
          bash ../.github/scripts/verify-release-assets.sh package.json v2.0.0 ../dist
      - name: Verify archive contents
        shell: bash
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            base=$(basename "$archive" .tar.gz)
            expected=$(printf '%s\n' "$base/LICENSE" "$base/README.md" "$base/codegraph" | sort)
            actual=$(tar -tzf "$archive" | grep -v '/$' | sort)
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          done
          for archive in dist/*.zip; do
            expected=$(printf '%s\n' 'LICENSE' 'README.md' 'codegraph.exe' | sort)
            actual=$(unzip -Z1 "$archive" | sed '/\/$/d' | sort)
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          done

  packed-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test packed installation
        working-directory: npm
        run: |
          npm test
          npm pack --dry-run
          bash ../.github/scripts/verify-release-assets_test.sh
