name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -timeout 20m ./...

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            archive_ext: tar.gz
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            archive_ext: tar.gz
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            archive_ext: tar.gz
          - runner: macos-15
            goos: darwin
            goarch: arm64
            archive_ext: tar.gz
          - runner: windows-2025
            goos: windows
            goarch: amd64
            archive_ext: zip
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            archive_ext: zip

    # All jobs on a release tag build the same immutable tag; never rerun a
    # completed publication workflow to replace assets under an existing tag.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Diagnose native Windows ARM64 toolchain
        if: ${{ matrix.goos == 'windows' && matrix.goarch == 'arm64' }}
        shell: pwsh
        run: |
          go version
          go env GOHOSTOS GOHOSTARCH GOOS GOARCH CGO_ENABLED CC CXX
          Get-CimInstance Win32_OperatingSystem | Format-List Caption,Version,OSArchitecture
          $env:PROCESSOR_ARCHITECTURE
          where.exe gcc
          where.exe clang
          $gcc = (Get-Command gcc).Source
          $clang = (Get-Command clang).Source
          & $gcc --version
          & $gcc -dumpmachine
          & $clang --version
          & $clang --target=aarch64-w64-windows-gnu -print-target-triple

      - name: Install pinned llvm-mingw and prove native cgo
        if: ${{ matrix.goos == 'windows' && matrix.goarch == 'arm64' }}
        shell: pwsh
        run: ./.github/scripts/setup-windows-arm64-cgo.ps1

      - name: Show build context
        shell: bash
        run: |
          set -euo pipefail
          echo "ref=${GITHUB_REF_NAME}"
          echo "runner=$(uname -a)"
          go version
          go env GOOS GOARCH CGO_ENABLED GOPATH GOMODCACHE GOCACHE

      - name: Build archive
        shell: bash
        run: bash .github/scripts/build-release-asset.sh "${GITHUB_REF_NAME}" "${{ matrix.goos }}" "${{ matrix.goarch }}" "${{ matrix.archive_ext }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/codegraph-v*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist
          find dist -type f \( -name "*.tar.gz" -o -name "*.tar.gz.sha256" -o -name "*.zip" -o -name "*.zip.sha256" -o -name "codegraph-v*" \) -exec cp {} release-dist/ \;

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          section_header="## ${version} -"

          awk -v header="$section_header" '
            BEGIN { found=0 }
            $0 ~ /^## / && found { exit }
            index($0, header) == 1 { found=1 }
            found { print }
          ' CHANGELOG.md > release-notes-full.md

          if ! grep -q "^## ${version} -" release-notes-full.md; then
            echo "Could not find release notes section for tag ${version} in CHANGELOG.md"
            exit 1
          fi

          tail -n +2 release-notes-full.md > release-notes.md

      - name: Verify complete native asset set and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist
          find dist -type f \( -name "*.tar.gz" -o -name "*.tar.gz.sha256" -o -name "*.zip" -o -name "*.zip.sha256" -o -name "codegraph-v*" \) -exec cp {} release-dist/ \;
          bash .github/scripts/verify-release-assets.sh npm/package.json "${GITHUB_REF_NAME}" release-dist

      - name: Create draft GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to overwrite or reuse it." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --draft

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" release-dist/*

      - name: Verify uploaded release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          uploaded=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)
          expected=$(for f in release-dist/*; do basename "$f"; done | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$uploaded")

      - name: Publish verified GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
