# Diagnosis branch only, never merged: repeats the watcher package on the
# standard windows-latest runner with store-close instrumentation.
name: diag-watcher-windows

on:
  push:
    branches:
      - diag/watcher-overflow-windows

permissions:
  contents: read

env:
  COUNT: "20"

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        trace: ["1", "0"]
        rep: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Use the runner temp volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Defender state
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: Get-MpComputerStatus | Select-Object AMRunningMode,RealTimeProtectionEnabled,OnAccessProtectionEnabled | Format-List

      - name: Exclude the temp volume from Defender
        if: false
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP
          (Get-MpPreference).ExclusionPath

      - name: Fetch Sysinternals handle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://download.sysinternals.com/files/Handle.zip -OutFile $env:RUNNER_TEMP\handle.zip
          Expand-Archive $env:RUNNER_TEMP\handle.zip -DestinationPath $env:RUNNER_TEMP\handle
          "DIAG_HANDLE_EXE=$env:RUNNER_TEMP\handle\handle64.exe" >> $env:GITHUB_ENV

      - name: Stress the watcher package
        shell: bash
        env:
          DIAG_TRACE: ${{ matrix.trace }}
        run: |
          set +e
          go version
          go test -json -count="$COUNT" -timeout 35m ./internal/watcher > watcher-${{ matrix.os }}-trace${{ matrix.trace }}-rep${{ matrix.rep }}.json
          status=$?
          go test -count=3 -run TestCancelledQueryLeavesNoStatement -v ./internal/diagsqlite 2>&1 | tee driver-repro-${{ matrix.os }}-trace${{ matrix.trace }}-rep${{ matrix.rep }}.txt | grep -E 'iteration|left a native|^(ok|FAIL|---)' | head -12 | tee -a "$GITHUB_STEP_SUMMARY"
          python .github/scripts/diag-watcher-summary.py watcher-${{ matrix.os }}-trace${{ matrix.trace }}-rep${{ matrix.rep }}.json | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: watcher-${{ matrix.os }}-trace${{ matrix.trace }}-rep${{ matrix.rep }}
          path: |
            watcher-${{ matrix.os }}-trace${{ matrix.trace }}-rep${{ matrix.rep }}.json
            driver-repro-${{ matrix.os }}-trace${{ matrix.trace }}-rep${{ matrix.rep }}.txt
