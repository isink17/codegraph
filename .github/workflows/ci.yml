name: CI

on:
  # integration/v2.0-wave-* branches stage one wave of reviewed feature PRs
  # before a single PR carries them into v2.0; they get the same full gate.
  push:
    branches:
      - v2.0
      - 'integration/v2.0-wave-*'
  pull_request:
    branches:
      - v2.0
      - 'integration/v2.0-wave-*'
    # Adding windows-stress to an open PR triggers the deep Windows gate.
    # Release-candidate checks use a PR targeting v2.0 with this label; no
    # workflow_dispatch or schedule can accidentally run against master.
    types: [opened, synchronize, reopened, edited, labeled]

jobs:
  # Classifies the change. Only a change limited to CHANGELOG.md, README.md
  # and docs/**/*.md, without the windows-stress label, is docs-only; it gets
  # whitespace and Markdown checks here and skips the Go jobs. Every other
  # change, and any classification that fails or cannot see both commits,
  # runs the full suite. No workflow-level paths filter: every job always
  # reports a result.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    env:
      CI_EVENT: ${{ github.event_name }}
      CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CI_STRESS: ${{ contains(github.event.pull_request.labels.*.name, 'windows-stress') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the classifier and the merge gate
        run: |
          bash .github/scripts/ci-changes_test.sh
          bash .github/scripts/merge-gate_test.sh
      - name: Classify changed files
        id: classify
        run: bash .github/scripts/ci-changes.sh classify >> "$GITHUB_OUTPUT"
      - name: Check documentation
        if: steps.classify.outputs.docs_only == 'true'
        run: bash .github/scripts/ci-changes.sh check-docs

  test-native:
    needs: changes
    # Skipped only after a successful docs-only classification and docs check;
    # any failure in the changes job runs the full suite.
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go_test_timeout: 20m
          - os: macos-latest
            go_test_timeout: 20m
          - os: windows-latest
            go_test_timeout: 30m
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Use the runner temp volume
        # Hosted Windows puts %TEMP% on the C: system volume, where every
        # SQLite commit and file create in t.TempDir() is several times to
        # tens of times slower than on the D: runner volume that holds the
        # workspace and RUNNER_TEMP. The store suite opens roughly a thousand
        # scratch databases and commits fixture rows one statement at a time,
        # so on C: internal/store took 1200-1800s against 300-450s on Linux
        # and repeatedly hit the 30m ceiling. On D: it runs near Linux parity.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Run tests
        # Go's timeout is a failure ceiling, not a runtime target. A passing
        # run does not wait longer, and hangs still fail at the ceiling.
        # Windows keeps 30m to absorb its wider runner-to-runner variance.
        run: go test -timeout ${{ matrix.go_test_timeout }} ./...

      - name: Check concurrent database open regression (Windows)
        if: runner.os == 'Windows'
        run: go test -timeout 20m ./internal/store -run '^(TestOpen_ConcurrentMigrateIsSafe|TestOpen_ConcurrentBootstrapRepeated)$' -count=5

      - name: Select deep Windows stress gate
        id: windows-stress
        if: runner.os == 'Windows'
        shell: pwsh
        # Apply windows-stress for SQLite concurrency/locking, snapshot
        # sharing/retry, relevant Windows filesystem race fixes, and final P37
        # release-candidate validation. Paths never select this gate.
        env:
          WINDOWS_STRESS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'windows-stress') }}
        run: |
          $runStress = $env:WINDOWS_STRESS_LABEL -eq 'true'
          "run=$($runStress.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($runStress) { Write-Host 'Deep Windows stress selected.' } else { Write-Host 'Deep Windows stress skipped for this change.' }

      - name: Repeat concurrent database open checks (Windows, deep stress)
        if: runner.os == 'Windows' && steps.windows-stress.outputs.run == 'true'
        run: go test -timeout 120m ./internal/store -run '^(TestOpen_ConcurrentMigrateIsSafe|TestOpen_ConcurrentBootstrapRepeated)$' -count=200

      - name: Smoke native binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-NativeSuccess([string]$name) {
            if ($LASTEXITCODE -ne 0) {
              throw "$name failed with exit code $LASTEXITCODE"
            }
          }
          $work = Join-Path $env:RUNNER_TEMP ("codegraph-smoke-" + [guid]::NewGuid())
          try {
            New-Item -ItemType Directory -Path $work | Out-Null
            $repo = Join-Path $work 'repo'
            $cgHome = Join-Path $work 'home'
            New-Item -ItemType Directory -Path $repo, $cgHome | Out-Null
            @"
          module smoke

          go 1.26
          "@ | Set-Content (Join-Path $repo 'go.mod')
            @"
          package smoke
          func Target() {}
          func Caller() { Target() }
          "@ | Set-Content (Join-Path $repo 'smoke.go')
            $binaryName = if ($IsWindows) { 'codegraph.exe' } else { 'codegraph' }
            $binary = Join-Path $work $binaryName
            go build -o $binary ./cmd/codegraph
            Assert-NativeSuccess 'go build'
            & $binary --version
            Assert-NativeSuccess 'codegraph --version'
            $env:CODEGRAPH_HOME = $cgHome
            & $binary index $repo
            Assert-NativeSuccess 'codegraph index'
            & $binary stats $repo
            Assert-NativeSuccess 'codegraph stats'
            $callees = & $binary find_callees $repo Caller
            Assert-NativeSuccess 'codegraph find_callees'
            $calleesJson = ($callees -join "`n") | ConvertFrom-Json
            if (-not $calleesJson.target_found -or $calleesJson.count -ne 1 -or @($calleesJson.callees).Count -ne 1 -or $calleesJson.callees[0].qualified_name -ne 'smoke.Target') {
              throw "Caller -> smoke.Target not found: $($callees -join "`n")"
            }
            & $binary update $repo
            Assert-NativeSuccess 'codegraph update'
          } finally {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $work
          }

  quality:
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./internal/mcp -run '^(TestFullToolsListIsByteIdentical|TestGatewayToolsListIsByteIdentical)$'
      - run: go test ./internal/indexer -run '^(TestUpdateReconsidersEdgeAfterCompetingDeclarationRemoved|TestAmbiguityOscillatesWithFreshParity)$'
      - run: go test -run '^$' -bench '^BenchmarkStoreFindCallers_Hub$' -benchtime=1x ./internal/store

  race:
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/store -run '^(TestOpen_ConcurrentMigrateIsSafe|TestOpen_ConcurrentBootstrapRepeated|TestNeighborConcurrentQueriesStayIsolated)$'
      - run: go test -race ./internal/indexer -run '^(TestUpdateTraversalFailureKeepsUnvisitedFilesAndRecovers|TestUpdateFileSymlinkSeesTargetEdits|TestIndexNonIndexableEntriesAreSkippedNotFatal)$'
      - run: go test -race ./internal/query
      - run: go test -race ./internal/mcp -run '^(TestConcurrentToolCallsAreMeteredSafely|TestGatewayToolsListIsByteIdentical|TestFullToolsListIsByteIdentical)$'

  no-cgo:
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go test ./internal/cli
      # The reduced build's capability contract: persisted capability, disclosed
      # limitations, rich-graph byte stability, downgrade refusal.
      - run: CGO_ENABLED=0 go test ./internal/store ./internal/mcp ./internal/indexer ./internal/doctor -run 'GraphCapability|RelationshipResponses|SymbolsOnlyLanguage|SupportedLanguagesReports|FreshIndexEqualsUpdate|ParserProfile'
      - run: CGO_ENABLED=0 go build ./cmd/codegraph
      # Type-checks every package and its tests without cgo, so a test that
      # uses a cgo-only helper without the build tag fails here.
      - run: CGO_ENABLED=0 go vet ./...

  # One stable result for branch rules: a skipped matrix job does not report
  # its per-OS check names, so require this job rather than the matrix legs.
  # Fails on any failed or cancelled job, and when classification failed.
  ci:
    needs: [changes, test-native, quality, race, no-cgo]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          echo "results: $RESULTS (docs_only=$DOCS_ONLY)"
          for r in $RESULTS; do
            case "$r" in
              success) ;;
              skipped) [ "$DOCS_ONLY" = true ] || { echo "a job was skipped without a docs-only classification"; exit 1; } ;;
              *) exit 1 ;;
            esac
          done
