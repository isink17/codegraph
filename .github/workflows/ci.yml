name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        # Explicit headroom over Go's 10-minute default: the store package runs
        # close to it on hosted Windows runners, where every test database pays
        # a WAL checkpoint flush on close. This is a failure ceiling, not a
        # budget -- a passing run takes exactly as long as it did before.
        run: go test -timeout 20m ./...
