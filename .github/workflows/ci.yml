name: CI

on:
  push:
    branches:
      - v2.0
  pull_request:
    branches:
      - v2.0
    # The windows-stress label forces the full non-docs suite and selects the
    # advisory test-windows job.
    # No workflow_dispatch or schedule can accidentally run against master.
    types: [opened, synchronize, reopened, edited, labeled]

# A newer PR run supersedes its predecessor. Pushes get unique groups so
# required branch validation is never cancelled by another CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classifies the change. Only a change limited to CHANGELOG.md, README.md
  # and docs/**/*.md, without the windows-stress label, is docs-only; it gets
  # whitespace and Markdown checks here and skips the Go jobs. All changes
  # also run the public boundary check. Any non-docs-only change, and any
  # classification that fails or cannot see both commits, runs the full suite.
  # No workflow-level paths filter: every job always reports a result.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    env:
      CI_EVENT: ${{ github.event_name }}
      CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CI_STRESS: ${{ contains(github.event.pull_request.labels.*.name, 'windows-stress') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the classifier
        run: bash .github/scripts/ci-changes_test.sh
      - name: Test the public boundary check
        run: bash .github/scripts/public-boundary_test.sh
      - name: Check the public boundary
        run: bash .github/scripts/public-boundary.sh
      - name: Classify changed files
        id: classify
        run: bash .github/scripts/ci-changes.sh classify >> "$GITHUB_OUTPUT"
      - name: Check documentation
        if: steps.classify.outputs.docs_only == 'true'
        run: bash .github/scripts/ci-changes.sh check-docs

  test-native:
    needs: changes
    # Skipped only after a successful docs-only classification and docs check;
    # any failure in the changes job runs the full suite.
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go_test_timeout: 20m
    # Windows runs in the separate, advisory test-windows job below until it
    # has a green record; then it can move into this matrix and the ci needs.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -timeout ${{ matrix.go_test_timeout }} ./internal/store ./...

  quality:
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./internal/mcp -run '^(TestFullToolsListIsByteIdentical|TestGatewayToolsListIsByteIdentical)$'
      - run: go test ./internal/indexer -run '^(TestUpdateReconsidersEdgeAfterCompetingDeclarationRemoved|TestAmbiguityOscillatesWithFreshParity)$'
      - run: go test -run '^$' -bench '^BenchmarkStoreFindCallers_Hub$' -benchtime=1x ./internal/store

  race:
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/store -run '^(TestOpen_ConcurrentMigrateIsSafe|TestOpen_ConcurrentBootstrapRepeated|TestNeighborConcurrentQueriesStayIsolated)$'
      - run: go test -race ./internal/indexer -run '^(TestUpdateTraversalFailureKeepsUnvisitedFilesAndRecovers|TestUpdateFileSymlinkSeesTargetEdits|TestIndexNonIndexableEntriesAreSkippedNotFatal)$'
      - run: go test -race ./internal/query
      - run: go test -race ./internal/mcp -run '^(TestConcurrentToolCallsAreMeteredSafely|TestGatewayToolsListIsByteIdentical|TestFullToolsListIsByteIdentical)$'

  no-cgo:
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go test ./internal/cli
      # The reduced build's capability contract: persisted capability, disclosed
      # limitations, rich-graph byte stability, downgrade refusal.
      - run: CGO_ENABLED=0 go test ./internal/store ./internal/mcp ./internal/indexer ./internal/doctor -run 'GraphCapability|RelationshipResponses|SymbolsOnlyLanguage|SupportedLanguagesReports|FreshIndexEqualsUpdate|ParserProfile'
      - run: CGO_ENABLED=0 go build ./cmd/codegraph
      # Type-checks every package and its tests without cgo, so a test that
      # uses a cgo-only helper without the build tag fails here.
      - run: CGO_ENABLED=0 go vet ./...

  jvm-binary-inspector:
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run pinned JVM helper fixture and association tests
        run: ./gradlew --no-daemon clean test installDist
        working-directory: tools/jvm-binary-inspector
      - name: Run Go JVM inspector integration tests
        run: go test ./internal/jvmbinary ./internal/cli -count=1

  # Windows runtime validation on the standard hosted windows-latest runner.
  # Advisory: it is not in the ci job's needs, so it neither blocks nor
  # replaces any required Linux check. It runs on pushes to v2.0 and on pull
  # requests labelled windows-stress; docs-only changes skip it. The summary
  # step lists every failed and skipped test; nothing is quarantined.
  test-windows:
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'windows-stress')) }}
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use the runner temp volume
        # %TEMP% on C: makes the store suite's scratch SQLite databases several
        # times slower than on the D: volume that holds RUNNER_TEMP.
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Show toolchain
        shell: bash
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          gcc --version | head -n 1
          git --version
          node --version

      - name: Build
        run: go build ./cmd/codegraph

      - name: Run tests
        shell: bash
        run: |
          set +e
          go test -json -timeout 30m ./internal/store ./... > go-test-windows.json
          status=$?
          python .github/scripts/go-test-summary.py go-test-windows.json
          exit $status

      - name: Upload test log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: go-test-windows
          path: go-test-windows.json
          retention-days: 14

      - name: Check concurrent database open regression
        if: ${{ !cancelled() }}
        run: go test -timeout 20m ./internal/store -run '^(TestOpen_ConcurrentMigrateIsSafe|TestOpen_ConcurrentBootstrapRepeated)$' -count=5

      - name: Test npm packed installation
        if: ${{ !cancelled() }}
        working-directory: npm
        run: |
          npm test
          npm pack --dry-run

      - name: Test install.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./.github/scripts/install-test.ps1

      - name: Smoke native binary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-NativeSuccess([string]$name) {
            if ($LASTEXITCODE -ne 0) { throw "$name failed with exit code $LASTEXITCODE" }
          }
          $work = Join-Path $env:RUNNER_TEMP ("codegraph-smoke-" + [guid]::NewGuid())
          try {
            $repo = Join-Path $work 'repo'
            $cgHome = Join-Path $work 'home'
            New-Item -ItemType Directory -Path $repo, $cgHome | Out-Null
            "module smoke`n`ngo 1.26`n" | Set-Content (Join-Path $repo 'go.mod')
            "package smoke`nfunc Target() {}`nfunc Caller() { Target() }`n" | Set-Content (Join-Path $repo 'smoke.go')
            $binary = Join-Path $work 'codegraph.exe'
            go build -o $binary ./cmd/codegraph
            Assert-NativeSuccess 'go build'
            & $binary --version
            Assert-NativeSuccess 'codegraph --version'
            $env:CODEGRAPH_HOME = $cgHome
            & $binary index $repo
            Assert-NativeSuccess 'codegraph index'
            & $binary stats $repo
            Assert-NativeSuccess 'codegraph stats'
            $callees = & $binary find_callees $repo Caller
            Assert-NativeSuccess 'codegraph find_callees'
            $calleesJson = ($callees -join "`n") | ConvertFrom-Json
            if (-not $calleesJson.target_found -or $calleesJson.count -ne 1 -or $calleesJson.callees[0].qualified_name -ne 'smoke.Target') {
              throw "Caller -> smoke.Target not found: $($callees -join "`n")"
            }
            & $binary update $repo
            Assert-NativeSuccess 'codegraph update'
          } finally {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $work
          }

  # One stable result for branch rules: a skipped matrix job does not report
  # its per-OS check names, so require this job rather than the matrix legs.
  # Fails on any failed or cancelled job, and when classification failed.
  ci:
    needs: [changes, test-native, quality, race, no-cgo, jvm-binary-inspector]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          echo "results: $RESULTS (docs_only=$DOCS_ONLY)"
          for r in $RESULTS; do
            case "$r" in
              success) ;;
              skipped) [ "$DOCS_ONLY" = true ] || { echo "a job was skipped without a docs-only classification"; exit 1; } ;;
              *) exit 1 ;;
            esac
          done
