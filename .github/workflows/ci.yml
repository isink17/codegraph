name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            go_test_timeout: 20m
          - os: macos-latest
            go_test_timeout: 20m
          - os: windows-latest
            go_test_timeout: 30m
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        # Go's timeout is a failure ceiling, not a runtime target. Hosted
        # Windows is materially slower because the store suite creates many
        # SQLite databases and pays WAL/file flush costs. Windows has crossed
        # 20 minutes as the semantic regression suite grew, so it gets 30m of
        # finite headroom; Linux/macOS retain the tighter 20m ceiling. A
        # passing run does not wait longer, and hangs still fail at 30m.
        run: go test -timeout ${{ matrix.go_test_timeout }} ./...
