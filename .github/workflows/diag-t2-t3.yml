# Diagnosis branch only, never merged: Windows validation of the CG-153 (#574)
# and CG-154 (#573) fixes. Earlier runs on this branch hold the A/B and probe.
name: diag-t2-t3

on:
  push:
    branches:
      - diag/t2-t3-windows

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        ref: [b86e2646be541a01e71e7dbe1cf6b473204f7562]
        rep: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: src
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Use the runner temp volume
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Repeat the watcher package
        shell: bash
        working-directory: src
        run: |
          set +e
          go test -json -count=20 -timeout 40m ./internal/watcher > ../out.json
          echo "go test exit $?"
          cd .. && python .github/scripts/diag-t2t3-summary.py out.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: package-${{ matrix.ref }}-rep${{ matrix.rep }}
          path: out.json
